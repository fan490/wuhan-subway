version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: webgis-postgres
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: webgis-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_dbms_security_auth__minimum__password__length: 4
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
