version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: webgis-postgres
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webgis"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: webgis-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123456
      NEO4J_dbms_security_auth__minimum__password__length: 4
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j123456 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  server:
    build: ./server
    container_name: webgis-server
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: webgis
      PG_USER: postgres
      PG_PASSWORD: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123456
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    container_name: webgis-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # 一次性运行：初始化地铁数据到 PostgreSQL 和 Neo4j
  init-db:
    build: ./server
    container_name: webgis-init-db
    profiles:
      - init
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: webgis
      PG_USER: postgres
      PG_PASSWORD: postgres
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123456
    command: node src/db/initData.js
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: no

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
